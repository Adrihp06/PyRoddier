[project]
name = "pyroddier"
version = "1.0.2"
description = "Aplicación GUI para análisis de aberraciones ópticas mediante el Test de Roddier"
authors = [
    {name = "Adrián Hernández Padrón", email = "adrihp06@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["astronomy", "optics", "roddier", "wavefront", "zernike", "telescope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "PyQt5==5.15.11",  # Fixed version that works on all platforms including Windows
    "PyQt5-Qt5==5.15.15",  # Fixed Qt5 binaries version
    "PyQt5-sip>=12.16.0,<13",  # Compatible sip version
    "numpy>=1.19.0",
    "matplotlib>=3.3.0",
    "astropy>=4.0.0",
    "scipy>=1.6.0",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.8.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pyroddier = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
