name: CI - Tests and Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (non-Windows)
        if: matrix.os != 'windows-latest'
        run: uv sync --all-extras --dev

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          uv sync --all-extras --dev --no-build
          uv pip install --force-reinstall "PyQt5==5.15.9" "PyQt5-Qt5==5.15.2" "PyQt5-sip<13,>=12.11"

      - name: Set Qt to offscreen mode (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Set Qt to offscreen mode (Windows)
        if: matrix.os == 'windows-latest'
        run: echo "QT_QPA_PLATFORM=offscreen" >> $env:GITHUB_ENV

      - name: Set Qt to offscreen mode (macOS)
        if: matrix.os == 'macos-latest'
        run: echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Run tests with coverage (non-Windows)
        if: matrix.os != 'windows-latest'
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Run tests with coverage (Windows)
        if: matrix.os == 'windows-latest'
        run: .venv\Scripts\python.exe -m pytest --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check for common issues
        run: |
          echo "✅ Dependencies installed successfully with uv"
          uv run python --version
