name: Build and Release Executables

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install pyinstaller

      - name: Set platform name and extension
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            echo "PLATFORM_NAME=windows" >> $GITHUB_ENV
            echo "EXT=zip" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            echo "PLATFORM_NAME=linux" >> $GITHUB_ENV
            echo "EXT=tar.gz" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            echo "PLATFORM_NAME=mac" >> $GITHUB_ENV
            echo "EXT=zip" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Build and compress executable (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $env:APP_NAME = "pyroddier-windows-${{ env.TAG_NAME }}"
          uv run pyinstaller src\main.py --noconfirm --clean --name $env:APP_NAME --distpath dist --add-data "icons;icons" --windowed --icon=icons\pyroddier_logo.png
          Compress-Archive -Path "dist\$env:APP_NAME\*" -DestinationPath "dist\$env:APP_NAME.zip"

      - name: Build and compress executable (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          APP_NAME="pyroddier-${{ env.PLATFORM_NAME }}-${TAG_NAME}"
          uv run pyinstaller src/main.py \
            --noconfirm \
            --clean \
            --name "$APP_NAME" \
            --distpath dist/ \
            --add-data "icons:icons" \
            --windowed \
            --icon=icons/pyroddier_logo.png

          cd dist

          # Limpia archivos temporales
          find . -name '__pycache__' -type d -exec rm -r {} + || true
          find . -name '*.py[co]' -delete || true

          if [[ "${{ env.PLATFORM_NAME }}" == "mac" ]]; then
            zip -r "${APP_NAME}.zip" "${APP_NAME}.app"
            rm -rf "${APP_NAME}.app"
          elif [[ "${{ env.PLATFORM_NAME }}" == "linux" ]]; then
            tar -czvf "${APP_NAME}.tar.gz" "${APP_NAME}"
            rm -rf "${APP_NAME}"
          fi

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v4
        with:
          name: "pyroddier-${{ env.PLATFORM_NAME }}-${{ env.TAG_NAME }}"
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Find built executables
        id: find_assets
        shell: bash
        run: |
          WINDOWS_ASSET=$(find artifacts/ -type f -name "*windows*.zip" | head -n 1)
          MAC_ASSET=$(find artifacts/ -type f -name "*mac*.zip" | head -n 1)
          LINUX_ASSET=$(find artifacts/ -type f -name "*linux*.tar.gz" | head -n 1)

          echo "windows_asset=$WINDOWS_ASSET" >> $GITHUB_OUTPUT
          echo "mac_asset=$MAC_ASSET" >> $GITHUB_OUTPUT
          echo "linux_asset=$LINUX_ASSET" >> $GITHUB_OUTPUT

          # Get the repository URL and tag name
          REPO_URL="https://github.com/${{ github.repository }}"
          TAG_NAME="${{ github.ref_name }}"

          echo "## 🚀 PyRoddier Release $TAG_NAME" > release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "Select the appropriate version for your operating system:" >> release_notes.md
          echo "" >> release_notes.md

          if [[ -f "$WINDOWS_ASSET" ]]; then
            WINDOWS_NAME=$(basename "$WINDOWS_ASSET")
            echo "#### 🪟 Windows" >> release_notes.md
            echo "- **[Download $WINDOWS_NAME]($REPO_URL/releases/download/$TAG_NAME/$WINDOWS_NAME)**" >> release_notes.md
            echo "  - Extract the ZIP file and run the executable" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [[ -f "$MAC_ASSET" ]]; then
            MAC_NAME=$(basename "$MAC_ASSET")
            echo "#### 🍎 macOS" >> release_notes.md
            echo "- **[Download $MAC_NAME]($REPO_URL/releases/download/$TAG_NAME/$MAC_NAME)**" >> release_notes.md
            echo "  - Extract the ZIP file and run the .app bundle" >> release_notes.md
            echo "  - You may need to allow the app in System Preferences > Security & Privacy" >> release_notes.md
            echo "" >> release_notes.md
          fi

          if [[ -f "$LINUX_ASSET" ]]; then
            LINUX_NAME=$(basename "$LINUX_ASSET")
            echo "#### 🐧 Linux" >> release_notes.md
            echo "- **[Download $LINUX_NAME]($REPO_URL/releases/download/$TAG_NAME/$LINUX_NAME)**" >> release_notes.md
            echo "  - Extract: \`tar -xzvf $LINUX_NAME\`" >> release_notes.md
            echo "  - Make executable: \`chmod +x pyroddier-linux-$TAG_NAME/pyroddier-linux-$TAG_NAME\`" >> release_notes.md
            echo "  - Run: \`./pyroddier-linux-$TAG_NAME/pyroddier-linux-$TAG_NAME\`" >> release_notes.md
            echo "" >> release_notes.md
          fi

          echo "### 📋 Requirements" >> release_notes.md
          echo "" >> release_notes.md
          echo "- No Python installation required" >> release_notes.md
          echo "- All dependencies are included in the executable" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🐛 Issues" >> release_notes.md
          echo "" >> release_notes.md
          echo "If you encounter any issues, please report them [here]($REPO_URL/issues)" >> release_notes.md

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.find_assets.outputs.windows_asset }}
            ${{ steps.find_assets.outputs.mac_asset }}
            ${{ steps.find_assets.outputs.linux_asset }}
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
